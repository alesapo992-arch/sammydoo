<style>
:root{color-scheme:dark;--ink:#211544;--yellow:#ffdf59;--pink:#ff4b87;--mint:#65f2c5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17112d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:4px solid white;outline-offset:4px}#stage{position:relative;width:100%;max-width:1120px;height:100%;height:100dvh;margin:auto;overflow:hidden;background:#f6dca9;isolation:isolate}canvas#game{width:100%;height:100%;display:block;touch-action:none;user-select:none}#hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;filter:drop-shadow(0 3px 0 #21154425)}.meter{background:var(--ink);padding:10px 12px;border-radius:18px;width:32%;max-width:190px}.label{font-size:10px;font-weight:900;letter-spacing:1.2px}.meter strong{float:right;color:var(--mint);font-size:12px}.track{height:9px;border-radius:8px;background:#493d62;margin-top:6px;overflow:hidden}#fill{width:100%;height:100%;background:var(--mint);border-radius:8px;transition:width .12s linear}#timer{background:white;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-size:27px;font-weight:950;font-variant-numeric:tabular-nums;min-width:82px;text-align:center}.score{background:var(--ink);border-radius:18px;padding:9px 13px;text-align:right;min-width:85px}.score b{display:block;font-size:22px;color:var(--yellow);line-height:1.1;font-variant-numeric:tabular-nums}#panic{position:absolute;top:93px;left:50%;transform:translateX(-50%);background:#ff3154;border:3px solid white;border-radius:16px;text-align:center;padding:7px 15px;white-space:nowrap;font-size:18px;font-weight:950;box-shadow:0 5px 0 #9c1944;display:none;pointer-events:none}#panic small{display:block;font-size:10px;letter-spacing:.7px}#audio{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:16px;border-radius:50%;width:42px;height:42px;background:#211544df;color:white;font-size:19px;z-index:3}#cover{position:absolute;inset:0;background:linear-gradient(180deg,#211544d9,#21154490 65%,#211544e8);display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:5;overflow:auto}.panel{width:min(100%,380px);text-align:center}.eyebrow{font-size:11px;font-weight:900;letter-spacing:3px;color:var(--mint);margin:0 0 10px}h1{font-size:clamp(42px,10vw,62px);letter-spacing:-3px;line-height:.92;margin:8px 0 12px;text-shadow:0 5px 0 #110b28}h1 span{color:var(--yellow)}.badge{display:inline-block;border:1px solid #ffffff50;border-radius:30px;padding:7px 13px;font-size:12px;font-weight:850;letter-spacing:1px;color:white;background:#ffffff10}.hero{font-size:54px;margin:18px 0 8px;letter-spacing:6px}.primary{display:block;width:100%;border:3px solid #211544;border-radius:21px;background:var(--yellow);color:var(--ink);padding:17px 20px;font-size:25px;font-weight:950;box-shadow:0 7px 0 #b37d28;margin-top:22px;transition:transform .1s}.primary:active{transform:translateY(5px);box-shadow:0 2px 0 #b37d28}.secondary{background:var(--pink);color:white;box-shadow:0 5px 0 #9d2354;font-size:17px;padding:12px;margin-top:14px}.sub{font-size:12px;color:#e0d5ef;margin:18px 0 0}.result-title{font-size:27px;line-height:1.05;letter-spacing:-1px;margin:10px 0}.result-score{font-size:64px;font-weight:950;color:var(--yellow);line-height:1.1}.stats{font-size:13px;color:#e2d9f0;margin:6px 0 14px}.board{background:#100b2680;border:1px solid #ffffff24;border-radius:16px;padding:12px 16px;text-align:left;margin-top:18px}.board h2{font-size:10px;letter-spacing:2px;color:var(--mint);margin:0 0 8px}.row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}.row span{color:#c4b6db}.row b{color:var(--yellow)}#shareImage{width:110px;border-radius:10px;display:block;margin:12px auto}#download{display:inline-block;color:var(--yellow);font-size:13px;font-weight:800;margin-top:10px}#shareStatus{font-size:12px;line-height:1.4;color:#e5dcf4}#resume{position:absolute;inset:0;background:#211544bb;z-index:8;display:none;place-items:center}#resume button{max-width:300px} [hidden]{display:none!important}@media(max-height:560px){#cover{padding:12px}.panel{width:min(90%,620px)}h1{font-size:40px}.hero{display:none}.primary{padding:10px;margin-top:12px}.result-score{font-size:38px}.board{margin-top:10px;padding:8px 16px}.row{display:inline-flex;width:48%;padding:2px 5px}.result-title{font-size:22px}.stats{margin:4px}.sub{margin:12px}#shareImage{width:65px}#panic{top:80px}}@media(prefers-reduced-motion:reduce){.primary,#fill{transition:none}}

<body>
<main id="stage" aria-label="Cuccioli Chaos Extreme Mode">
<canvas id="game" aria-label="Stanza dei cuccioli: tocca o scorri sulle macchie per pulire"></canvas>
<div id="hud"><div class="meter"><span class="label">PULIZIA</span><strong id="percent">100%</strong><div class="track"><div id="fill"></div></div></div><div id="timer">60<span style="font-size:13px">s</span></div><div class="score"><span class="label">PUNTI</span><b id="score">0</b></div></div>

<div id="cover"><section class="panel" id="intro"><p class="eyebrow">60 SECONDI. ZERO PIETÀ.</p><h1>CUCCIOLI<br><span>CHAOS</span></h1><div class="badge">⚡ EXTREME MODE ⚡</div><div class="hero" aria-hidden="true">🐶 💩 🐶</div><button class="primary" id="play">PLAY ▶</button><p class="sub">Una stanza. Tre cuccioli. Quanto resisti?</p></section>
<section class="panel" id="results" hidden><p class="eyebrow">CUCCIOLI CHAOS · EXTREME</p><h2 class="result-title" id="verdict"></h2><div class="result-score" id="finalScore"></div><p class="stats" id="stats"></p><button class="primary" id="again">RIPROVA ↻</button><button class="primary secondary" id="share">CONDIVIDI ↗</button><div id="sharePreview" hidden><img id="shareImage" alt="Cartolina con il risultato della partita"><p id="shareStatus"></p><a id="download" download="cuccioli-chaos.png">SCARICA IMMAGINE ↓</a></div><div class="board"><h2>I TUOI 5 RECORD</h2><div id="ranking"></div></div></section></div>
<div id="resume"><button class="primary" id="resumeButton">RIPRENDI ▶</button></div>
</main>
<script>
'use strict';
// Porting della logica Pygame: bersagli casuali, immunità, zampe sporche e tracce.
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=420,H=780,scale=1,dpr=1,last=0,paused=false,muted=false;
const G={state:'intro',time:0,score:0,clean:100,dogs:[],messes:[],particles:[],popups:[],flights:[],combo:0,lastClean:-9,panic:false,panicLeft:10,shake:0,spawn:15,beat:0,flash:0,binPop:0,trail:[],result:null};
const colors=['#ff4b87','#64eaca','#ffdf59','#80b8ff','#c594ff','#ff984d'];
function resize(){const r=canvas.getBoundingClientRect(),oldW=W,oldH=H;scale=Math.min(r.width/420,r.height/620);W=r.width/scale;H=r.height/scale;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);for(const p of G.dogs){p.x=p.x/oldW*W;p.y=clamp(p.y/oldH*H,145,H-65);p.target=target()}for(const m of G.messes){m.x*=W/oldW;m.y=clamp(m.y*H/oldH,145,H-60)}}
window.addEventListener('resize',resize);resize();
function target(){return{x:rnd(40,W-40),y:rnd(150,H-80)}}
function addDog(initial=false){const t=target();G.dogs.push({x:initial?t.x:35,y:initial?t.y:H*.5,target:target(),speed:rnd(65,100)*1.4,facing:1,next:rnd(1.5,2.5),immunity:1.5,dirty:null,step:0,phase:rnd(0,6),color:colors[G.dogs.length%6]});if(!initial){popup(W/2,H*.30,'+1 CUCCIOLO!','#211544',26);sfx('squeak');G.shake=5}}
// Audio sintetico: nessun campione o risorsa di rete.
let audio=null,noise=null;
function unlock(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();noise=audio.createBuffer(1,Math.floor(audio.sampleRate*.2),audio.sampleRate);const a=noise.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){audio=null}}
function tone(f,end,dur,vol,type='sine',delay=0){if(!audio||muted||audio.state!=='running')return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+dur);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.015)}
function sfx(kind){if(!audio||muted)return;if(kind==='pop'){tone(420+G.combo*35,1100,.085,.11);tone(140,55,.1,.12)}if(kind==='squeak')tone(1100,2100,.13,.055,'triangle');if(kind==='splat'){tone(160,38,.18,.13,'triangle');const s=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter(),t=audio.currentTime;s.buffer=noise;f.type='lowpass';f.frequency.value=550;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);s.connect(f);f.connect(g);g.connect(audio.destination);s.start();s.stop(t+.17)}if(kind==='panic'){tone(480,950,.24,.08,'sawtooth');tone(950,480,.24,.06,'sawtooth',.25)}}
$('audio').onclick=()=>{unlock();muted=!muted;$('audio').textContent=muted?'♫̸':'♫';$('audio').setAttribute('aria-label',muted?'Attiva audio':'Disattiva audio')};
function start(){unlock();Object.assign(G,{state:'play',time:0,score:0,clean:100,dogs:[],messes:[],particles:[],popups:[],flights:[],combo:0,lastClean:-9,panic:false,panicLeft:10,shake:0,spawn:15,beat:0,flash:0,trail:[],result:null});paused=false;pointer=null;$('cover').style.display='none';$('panic').style.display='none';$('sharePreview').hidden=true;$('resume').style.display='none';for(let i=0;i<3;i++)addDog(true);
// Tre macchie iniziali e un gesto animato mostrano la regola senza un tutorial.
addMess(W*.35,H*.49,'pee');addMess(W*.60,H*.58,'poop');addMess(W*.42,H*.67,'paw_pee');updateHud()}
$('play').onclick=start;$('again').onclick=start;
function addMess(x,y,kind){if(G.messes.length>=230)return;G.messes.push({x:clamp(x,25,W-25),y:clamp(y,135,H-35),kind,age:0,seed:rnd(0,6)})}
function dirtWeight(m){return m.kind==='poop'?2.8:m.kind==='pee'?2:1.2}
function cleanliness(){G.clean=clamp(100-G.messes.reduce((s,m)=>s+dirtWeight(m),0),0,100)}
function popup(x,y,text,color='#fff',size=23){if(G.popups.length>36)G.popups.shift();G.popups.push({x,y,text,color,size,life:1,max:1})}
function burst(x,y,dirty=false,kind='pee'){const n=reduceMotion?4:dirty?10:15;for(let i=0;i<n;i++){if(G.particles.length>=320)G.particles.shift();const a=rnd(0,Math.PI*2),v=rnd(45,180);G.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-45,life:rnd(.35,.7),max:.7,r:rnd(2,6),star:!dirty&&i%3===0,color:dirty?(kind==='poop'?'#9a542e':'#ffd52d'):colors[i%colors.length]})}}
function clean(m){const i=G.messes.indexOf(m);if(i<0)return;G.messes.splice(i,1);G.combo=G.time-G.lastClean<.5?G.combo+1:1;G.lastClean=G.time;const base=m.kind==='poop'?50:m.kind==='pee'?25:10,points=base*G.combo;G.score+=points;burst(m.x,m.y);popup(m.x,m.y-20,'+'+points,'#fff',G.combo>2?28:23);if(m.kind==='poop')G.flights.push({x:m.x,y:m.y,t:0});sfx('pop');try{if(navigator.vibrate)navigator.vibrate(9)}catch(e){}cleanliness()}
// Collisione segmento/cerchio: anche uno swipe veloce non salta le macchie.
function segmentDistance(m,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=l?clamp(((m.x-a.x)*dx+(m.y-a.y)*dy)/l,0,1):0;return Math.hypot(m.x-a.x-t*dx,m.y-a.y-t*dy)}
let pointer=null;
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function sweep(a,b){for(const m of [...G.messes])if(segmentDistance(m,a,b)<(m.kind.startsWith('paw')?24:32))clean(m);G.trail.push({...b,life:.18});if(G.trail.length>30)G.trail.shift()}
canvas.addEventListener('pointerdown',e=>{if(G.state!=='play'||paused||pointer)return;e.preventDefault();unlock();canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,...point(e)};sweep(pointer,pointer)});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||paused)return;e.preventDefault();const p=point(e);sweep(pointer,p);pointer={id:e.pointerId,...p}});
function release(e){if(pointer&&pointer.id===e.pointerId)pointer=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
function update(dt){if(G.state!=='play'||paused)return;G.time=Math.min(60,G.time+dt);if(G.time>=G.spawn&&G.time<60){if(G.dogs.length<8)addDog();G.spawn+=15}for(const m of G.messes)m.age+=dt;
for(const p of G.dogs){p.phase+=dt*13;p.immunity-=dt;p.next-=dt;const dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy),v=p.speed*(G.panic?2:1);if(d<10)p.target=target();else{p.x+=dx/d*v*dt;p.y+=dy/d*v*dt;if(Math.abs(dx)>2)p.facing=dx>0?1:-1}
// Conservate le immunità dell'originale: 0,8 s sulla macchia, 1,5 s sul cucciolo.
if(p.immunity<=0&&!p.dirty){const m=G.messes.find(m=>!m.kind.startsWith('paw')&&m.age>=.8&&Math.hypot(p.x-m.x,p.y+14-m.y)<28);if(m){p.dirty=m.kind;p.step=0;G.shake=reduceMotion?0:7;burst(p.x,p.y+12,true,m.kind);sfx('splat');sfx('squeak')}}
if(p.dirty){p.step+=dt;if(p.step>=.35){p.step-=.35;addMess(p.x+rnd(-6,6),p.y+18,'paw_'+p.dirty);if(Math.random()<.18)p.dirty=null}}
if(p.next<=0){const kind=Math.random()<.48?'poop':'pee';addMess(p.x,p.y+17,kind);p.next=rnd(1.5,2.5);p.immunity=1.5;burst(p.x,p.y+17,true,kind);sfx('splat');if(Math.random()<.25)sfx('squeak')}
}
cleanliness();if(!G.panic&&G.clean<25){G.panic=true;G.panicLeft=10;G.shake=reduceMotion?0:18;G.flash=.4;sfx('panic')}else if(G.panic&&G.clean>=25){G.panic=false;G.panicLeft=10;popup(W/2,H*.35,'STANZA SALVATA!','#65f2c5',27)}
if(G.panic){G.panicLeft-=dt;if(G.panicLeft<=0){finish(false);return}}if(G.clean<=0){finish(false);return}if(G.time>=60){finish(true);return}
G.beat-=dt;if(G.beat<=0){G.beat=G.panic?.20:.40;const n=Math.floor(G.time/(G.panic?.20:.40))%4;tone([131,165,196,165][n],90,.09,.028,'triangle');if(G.panic)tone(550+(10-G.panicLeft)*45,900,.12,.025,'square')}
G.shake=Math.max(0,G.shake-dt*35);G.flash=Math.max(0,G.flash-dt);G.binPop=Math.max(0,G.binPop-dt*3);
for(const p of G.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt}G.particles=G.particles.filter(p=>p.life>0);for(const p of G.popups){p.life-=dt;p.y-=40*dt}G.popups=G.popups.filter(p=>p.life>0);for(const f of G.flights){f.t+=dt*2.6;if(f.t>=1)G.binPop=1}G.flights=G.flights.filter(f=>f.t<1);for(const t of G.trail)t.life-=dt;G.trail=G.trail.filter(t=>t.life>0);updateHud()}
function updateHud(){$('score').textContent=G.score.toLocaleString('it-IT');$('percent').textContent=Math.ceil(G.clean)+'%';$('fill').style.width=G.clean+'%';$('fill').style.background=G.clean<25?'#ff4b67':G.clean<50?'#ffdf59':'#65f2c5';$('timer').innerHTML=Math.max(0,Math.ceil(60-G.time))+'<span style="font-size:13px">s</span>';$('panic').style.display=G.panic&&G.state==='play'?'block':'none';$('countdown').textContent=Math.max(0,Math.ceil(G.panicLeft))}
function readRecords(){try{const a=JSON.parse(localStorage.getItem('cuccioli-chaos-v1')||'[]');return Array.isArray(a)?a.filter(r=>r&&Number.isFinite(r.score)&&Number.isFinite(r.seconds)).slice(0,5):[]}catch(e){return[]}}
function finish(win){G.state='end';pointer=null;G.popups=[];G.particles=[];G.trail=[];G.flights=[];G.shake=0;const verdict=win?'🏆 MAESTRO DELLA PULIZIA':G.time<25?'💀 DISASTRO TOTALE':'🐶 I CUCCIOLI HANNO VINTO';G.result={score:G.score,seconds:Math.floor(G.time),dogs:G.dogs.length,clean:Math.ceil(G.clean),win,verdict};const records=readRecords();records.push(G.result);records.sort((a,b)=>b.score-a.score||b.seconds-a.seconds);records.splice(5);try{localStorage.setItem('cuccioli-chaos-v1',JSON.stringify(records))}catch(e){}$('verdict').textContent=verdict;$('finalScore').textContent=G.score.toLocaleString('it-IT');$('stats').textContent=`${G.result.seconds}s di caos · ${G.dogs.length} cuccioli · ${G.result.clean}% pulizia`;$('ranking').replaceChildren();records.forEach((r,i)=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span'),score=document.createElement('b');name.textContent=`${i+1}. ${r.seconds}s · ${r.dogs||3} cuccioli`;score.textContent=r.score.toLocaleString('it-IT');row.append(name,score);$('ranking').append(row)});$('intro').hidden=true;$('results').hidden=false;$('cover').style.display='flex';updateHud();if(win){tone(523,523,.14,.08);tone(659,659,.14,.08,'sine',.14);tone(784,1047,.3,.09,'sine',.28)}else tone(210,55,.4,.1,'triangle')}
// Primitive condivise: tutta la grafica viene generata in Canvas 2D.
function ellipse(c,x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
function poly(c,pts,color){c.fillStyle=color;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
function round(c,x,y,w,h,r,color){r=Math.min(r,w/2,h/2);c.fillStyle=color;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill()}
function text(c,s,x,y,size,color='#211544',align='center'){c.font=`900 ${size}px system-ui, sans-serif`;c.fillStyle=color;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y)}
function dog(c,p,t=0,size=1){c.save();c.translate(p.x,p.y);c.scale((p.facing||1)*size,size);const bounce=Math.sin((p.phase||0)+t)*2;ellipse(c,0,19,35,9,'#48315b25');c.translate(0,bounce);
// Coda folta, calzini bianchi, mantello nero e mascherina Border Collie.
c.save();c.translate(-25,-5);c.rotate(Math.sin((p.phase||0)*.7)*.25);poly(c,[[-2,7],[-24,0],[-32,-18],[-19,-12],[-15,-21],[-8,-8],[5,-2]],'#252335');poly(c,[[-24,0],[-32,-18],[-19,-12],[-21,-4]],'#fff9ec');c.restore();
for(const x of [-18,15]){const dy=Math.sin((p.phase||0)+x)*3;round(c,x-5,5+dy,11,17,5,'#272536');round(c,x-5,17+dy,12,7,3,'#fff9ec')}
ellipse(c,-2,-1,28,18,'#272536');ellipse(c,13,1,11,16,'#fff9ec');ellipse(c,22,-15,19,20,'#272536');poly(c,[[7,-27],[9,-48],[20,-38],[19,-28]],'#272536');poly(c,[[25,-29],[38,-43],[40,-27],[34,-22]],'#272536');poly(c,[[9,-43],[14,-34],[11,-32]],'#e69caf');poly(c,[[34,-37],[37,-29],[32,-30]],'#e69caf');poly(c,[[18,-34],[26,-33],[25,-18],[33,-7],[16,-5],[14,-18]],'#fff9ec');ellipse(c,30,-9,14,10,'#fff9ec');ellipse(c,39,-12,5,4,'#272536');ellipse(c,15,-20,3.8,4.8,'#0e1024');ellipse(c,30,-22,3,4,'#0e1024');ellipse(c,16,-22,1.2,1.4,'white');ellipse(c,31,-23,1,1.2,'white');ellipse(c,29,0,4,5,'#ff7799');round(c,8,2,23,5,2,p.color||'#ff4b87');ellipse(c,24,10,3,4,'#ffdf59');if(p.dirty){ellipse(c,-17,23,6,3,p.dirty==='poop'?'#9a542e':'#e8bb24');ellipse(c,17,23,6,3,p.dirty==='poop'?'#9a542e':'#e8bb24')}
if(p.next<.38){ellipse(c,22,-62,10,12,'#fff');text(c,'!',22,-62,17,'#ff3154')}c.restore()}
function mess(c,m){const{x,y,kind}=m;if(kind==='poop'){ellipse(c,x,y+3,21,7,'#48315b25');ellipse(c,x,y-2,17,10,'#784027');ellipse(c,x+1,y-12,12,8,'#995633');ellipse(c,x+2,y-21,6,6,'#bd7641');ellipse(c,x-6,y-13,3,2,'#df9b58');ellipse(c,x-5,y-4,2,2,'#291d2c');ellipse(c,x+5,y-4,2,2,'#291d2c')}else if(kind==='pee'){ellipse(c,x,y,29,14,'#d9a91d');ellipse(c,x,y-2,27,13,'#ffdb37');ellipse(c,x-9,y-6,9,3,'#fff3a4');ellipse(c,x+15,y+2,4,2,'#fff3a4')}else{c.save();c.translate(x,y);c.rotate(Math.sin(m.seed||0)*.5);const col=kind==='paw_poop'?'#9b5e3a':'#dcae20';ellipse(c,0,3,8,6,col);for(const [x,y]of[[-9,-4],[-4,-9],[4,-9],[9,-4]])ellipse(c,x,y,3.4,4,col);c.restore()}}
function bin(c){const x=W-48,y=H-55;c.save();c.translate(x,y);c.scale(1+G.binPop*.12,1+G.binPop*.12);ellipse(c,0,27,30,8,'#48315b30');round(c,-23,-15,46,44,7,'#211544');round(c,-19,-12,38,36,5,'#58dbb3');for(const dx of[-10,0,10])round(c,dx-2,-6,4,22,2,'#278b83');round(c,-27,-22,54,9,4,'#211544');round(c,-11,-28,22,6,3,'#211544');text(c,'↙',0,3,23,'#211544');c.restore()}
function star(c,x,y,r,color){const pts=[];for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,k=i%2?.42:1;pts.push([x+Math.cos(a)*r*k,y+Math.sin(a)*r*k])}poly(c,pts,color)}
function draw(){ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(G.shake&&!reduceMotion&&G.state==='play'&&!paused)ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));ctx.fillStyle='#f7dfb8';ctx.fillRect(-25,-25,W+50,H+50);const tile=56;for(let y=105;y<H+tile;y+=tile)for(let x=-tile;x<W+tile;x+=tile)if((Math.floor(x/tile)+Math.floor((y-105)/tile))%2===0){ctx.fillStyle='#edcda0';ctx.fillRect(x,y,tile,tile)}ctx.fillStyle='#cda67e';ctx.fillRect(0,100,W,7);ctx.fillStyle='#fff0d4';ctx.fillRect(0,92,W,8);
for(const m of G.messes)mess(ctx,m);bin(ctx);for(const p of [...G.dogs].sort((a,b)=>a.y-b.y))dog(ctx,p);
for(const f of G.flights){const t=f.t,e=1-(1-t)*(1-t);ctx.save();ctx.translate(f.x+(W-48-f.x)*e,f.y+(H-65-f.y)*e-Math.sin(t*Math.PI)*100);ctx.scale(1-t*.65,1-t*.65);ctx.rotate(t*8);mess(ctx,{x:0,y:0,kind:'poop'});ctx.restore()}
for(const p of G.particles){ctx.globalAlpha=clamp(p.life/.3,0,1);if(p.star)star(ctx,p.x,p.y,p.r*1.8,p.color);else ellipse(ctx,p.x,p.y,p.r,p.r,p.color)}ctx.globalAlpha=1;
if(G.trail.length>1){ctx.lineCap='round';ctx.lineJoin='round';for(let i=1;i<G.trail.length;i++){const a=G.trail[i-1],b=G.trail[i];ctx.strokeStyle=`rgba(255,255,255,${b.life/.18*.8})`;ctx.lineWidth=9*b.life/.18;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
for(const p of G.popups){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.font=`900 ${p.size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='#211544';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y)}ctx.globalAlpha=1;ctx.restore();
if(G.panic&&G.state==='play'){ctx.save();const grad=ctx.createRadialGradient(W/2,H/2,W*.15,W/2,H/2,Math.max(W,H)*.65);grad.addColorStop(0,'#ff174400');grad.addColorStop(1,`rgba(255,20,60,${.40+Math.sin(G.time*10)*.14})`);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.restore()}
if(G.combo>1&&G.time-G.lastClean<.65&&G.state==='play'){const t=G.time-G.lastClean;ctx.save();ctx.translate(W/2,H*.29);const s=1+Math.max(0,.16-t)*1.7;ctx.scale(s,s);ctx.font='950 52px system-ui';ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#211544';ctx.strokeText('×'+G.combo,0,0);ctx.fillStyle='#ffdf59';ctx.fillText('×'+G.combo,0,0);text(ctx,'COMBO!',0,24,13,'#211544');ctx.restore()}
// Gesto dimostrativo solo nei primi tre secondi, senza parole.
if(G.state==='play'&&G.time<3&&G.score===0){const t=(G.time%1.5)/1.5,x=W*.25+t*W*.45,y=H*.49+t*H*.09;ctx.save();ctx.globalAlpha=Math.sin(t*Math.PI)*.85;ellipse(ctx,x,y,20,20,'#ffffff99');text(ctx,'☝',x,y,43,'#fff');ctx.restore()}}
function loop(now){const dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}
for(let i=0;i<3;i++)addDog(true);addMess(W*.34,H*.48,'poop');addMess(W*.62,H*.67,'pee');requestAnimationFrame(loop);
// Sospensione esplicita: non si perde una partita cambiando scheda o applicazione.
document.addEventListener('visibilitychange',()=>{if(document.hidden){pointer=null;if(G.state==='play'){paused=true;$('resume').style.display='grid'}if(audio)audio.suspend().catch(()=>{})}});$('resumeButton').onclick=()=>{unlock();paused=false;last=performance.now();$('resume').style.display='none'};
// Cartolina originale 1080×1350: esportazione Canvas, nessuna libreria esterna.
let shareBlob=null;
function shareCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const q=c.getContext('2d'),r=G.result;q.fillStyle='#211544';q.fillRect(0,0,1080,1350);for(let y=830;y<1350;y+=90)for(let x=0;x<1080;x+=90){q.fillStyle=(x/90+y/90|0)%2?'#f4d8ab':'#eac494';q.fillRect(x,y,90,90)}text(q,'EXTREME MODE',540,100,29,'#65f2c5');text(q,'CUCCIOLI',540,200,98,'#fff');text(q,'CHAOS',540,298,122,'#ffdf59');round(q,80,365,920,400,46,'#342350');text(q,r.score.toLocaleString('it-IT'),540,475,136,'#ffdf59');text(q,'PUNTI DI PURO CAOS',540,570,25,'#fff');text(q,`${r.seconds}s · ${r.dogs} CUCCIOLI · ${r.clean}% PULIZIA`,540,646,31,'#65f2c5');text(q,r.win?'MAESTRO DELLA PULIZIA':r.seconds<25?'DISASTRO TOTALE':'I CUCCIOLI HANNO VINTO',540,716,31,'#fff');dog(q,{x:300,y:1020,facing:1,color:'#ff4b87',phase:1,next:1},0,3);dog(q,{x:790,y:1020,facing:-1,color:'#65f2c5',phase:3,next:1},0,3);mess(q,{x:540,y:1005,kind:'poop'});round(q,90,1130,900,145,28,'#211544');text(q,'RIESCI A BATTERMI?',540,1180,46,'#fff');text(q,'#CuccioliChaos',540,1237,31,'#ffdf59');return c}
$('share').onclick=async()=>{if(!G.result)return;const btn=$('share');btn.disabled=true;const r=G.result,phrase=`Ho sopravvissuto ${r.seconds}s a ${r.dogs} cuccioli caotici! Riesci a battermi? 🐶💩 #CuccioliChaos`;try{const c=shareCard(),url=c.toDataURL('image/png');$('shareImage').src=url;$('download').href=url;$('sharePreview').hidden=false;$('shareStatus').textContent=phrase;shareBlob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));const file=shareBlob&&typeof File!=='undefined'?new File([shareBlob],'cuccioli-chaos.png',{type:'image/png'}):null;if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Cuccioli Chaos',text:phrase})}else if(navigator.share){await navigator.share({title:'Cuccioli Chaos',text:phrase})}else{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(phrase);$('shareStatus').textContent='Testo copiato! '+phrase}}catch(e){}}}catch(e){if(e.name!=='AbortError')$('shareStatus').textContent=phrase+' Salva l’immagine qui sotto per condividerla.'}finally{btn.disabled=false}};
