<style>

rgin:12px auto}#download{display:inline-block;color:var(--yellow);font-size:13px;font-weight:800;margin-top:10px}#shareStatus{font-size:12px;line-height:1.4;color:#e5dcf4}#resume{position:absolute;inset:0;background:#211544bb;z-index:8;display:none;place-items:center}#resume button{max-width:300px} [hidden]{display:none!important}@media(max-height:560px){#cover{padding:12px}.panel{width:min(90%,620px)}h1{font-size:40px}.hero{display:none}.primary{padding:10px;margin-top:12px}.result-score{font-size:38px}.board{margin-top:10px;padding:8px 16px}.row{display:inline-flex;width:48%;padding:2px 5px}.result-title{font-size:22px}.stats{margin:4px}.sub{margin:12px}#shareImage{width:65px}#panic{top:80px}}@media(prefers-reduced-motion:reduce){.primary,#fill{transition:none}}

<body>

<div id="cover"><section class="panel" id="intro"><p class="eyebrow">60 SECONDI. ZERO PIETÀ.</p><h1>CUCCIOLI<br><span>CHAOS</span></h1><div class="badge">⚡ EXTREME MODE ⚡</div><div class="hero" aria-hidden="true">🐶 💩 🐶</div><button class="primary" id="play">PLAY ▶</button><p class="sub">Una stanza. Due cuccioli. Quanto resisti?</p></section>

<script>
'use strict';
// Porting della logica Pygame: bersagli casuali, immunità, zampe sporche e tracce.
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=420,H=780,scale=1,dpr=1,last=0,paused=false,muted=false;
const G={state:'intro',time:0,score:0,clean:100,dogs:[],messes:[],particles:[],popups:[],flights:[],combo:0,lastClean:-9,panic:false,panicLeft:10,shake:0,spawn:15,beat:0,flash:0,binPop:0,trail:[],result:null};
// Parametri di bilanciamento: coordinate logiche della stanza.
const HITBOX_TAP=20,HITBOX_SWIPE=40;
const PAWPRINT_INTERVAL=.9,PAWPRINT_PENALTY=3,MAX_PAWPRINTS_PER_PUPPY=4,PAWPRINT_CLEANUP_CHANCE=.30;
const STARTING_PUPPIES=2,FIRST_MESS_GRACE=5,MESS_INTERVAL_MIN=9,MESS_INTERVAL_MAX=14;
// Due presenze a t=0; poi la curva raggiunge cinque cuccioli a t=44.
const PUPPY_SPAWN_TIMES=[0,0,18,32,44];
const CLEAN_RESTORE={poop_tap:4,smear_tap:2,swipe_single:2,swipe_perfect:8,smear_penalty:-5};
function restoreClean(amount){G.clean=clamp(G.clean+amount,0,100)}
function flashScreen(color,duration){G.colorFlash={color,left:duration,duration}}
const colors=['#ff4b87','#64eaca','#ffdf59','#80b8ff','#c594ff','#ff984d'];
function resize(){const r=canvas.getBoundingClientRect(),oldW=W,oldH=H;scale=Math.min(r.width/420,r.height/620);W=r.width/scale;H=r.height/scale;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);for(const p of G.dogs){p.x=p.x/oldW*W;p.y=clamp(p.y/oldH*H,145,H-65);p.target=target()}for(const m of G.messes){m.x*=W/oldW;m.y=clamp(m.y*H/oldH,145,H-60)}}
window.addEventListener('resize',resize);resize();
function target(){return{x:rnd(40,W-40),y:rnd(150,H-80)}}
// Identità condivise da simulazione, disegno e cartolina. Ogni istanza copia i colori.
const PUPPY_PROFILES=[
 {name:'Paris',colors:{body:'#FFFFFF',patches:['#C85A54','#A0483F'],ears:'#A0483F',collar:'#FF69B4'},personality:'elegant'},
 {name:'Jess',colors:{body:'#FFFFFF',patches:['#1A1A1A'],ears:'#1A1A1A',collar:'#3988FF'},personality:'classic'},
 {name:'Marley',colors:{body:'#FFFFFF',patches:['#1A1A1A','#8B5A3C'],ears:'#1A1A1A',collar:'#31BA64'},personality:'playful'},
 {name:'Nebula',colors:{body:'#F5F5F5',patches:['#1A1A1A','#B48661'],ears:'#1A1A1A',collar:'#A85CE5'},personality:'shy'},
 {name:'Tilio',colors:{body:'#FFFFFF',patches:['#1A1A1A','#8B5A3C'],ears:'#1A1A1A',collar:'#F04649'},personality:'mischievous'}
];
const TEMPERAMENTS={
 elegant:{speed:.98,gait:10,bounce:1,stride:2,turn:3},
 classic:{speed:1,gait:13,bounce:2,stride:3,turn:6},
 playful:{speed:1.08,gait:16,bounce:4,stride:5,turn:5},
 shy:{speed:.86,gait:10,bounce:.8,stride:1.8,turn:3},
 mischievous:{speed:1.08,gait:15,bounce:2.7,stride:4,turn:9}
};
function addDog(initial=false){
 const index=G.dogs.length,profile=PUPPY_PROFILES[index%PUPPY_PROFILES.length],t=target();
 if(index>=5)return;
 const name=profile.name;
 G.dogs.push({id:index,name,colors:{...profile.colors,patches:[...profile.colors.patches]},personality:profile.personality,expression:'normal',
 x:initial?t.x:45,y:initial?t.y:H*.5,target:target(),speed:rnd(65,100),facing:1,
 next:initial?rnd(FIRST_MESS_GRACE,FIRST_MESS_GRACE+3):rnd(MESS_INTERVAL_MIN,MESS_INTERVAL_MAX),immunity:1.5,dirty:null,step:0,phase:rnd(0,6),vx:0,vy:0,turnIn:rnd(.6,1.4),moodLeft:0});
 if(!initial){popup(W/2,H*.30,name+' è arrivata!','#211544',26);sfx('squeak');G.shake=5}
}
// Rory entra una volta: il timer non dipende dal panico né dalla fortuna.
const rory={isActive:false,hasEntered:false,x:0,y:0,targetX:0,targetY:0,ballX:0,ballY:0,timer:0,duration:0,direction:1,targetChangeTimer:0,message:'',messageLeft:0,ballContacts:new Set()};
function resetRory(){Object.assign(rory,{isActive:false,hasEntered:false,spawnAt:rnd(15,20),timer:0,message:'',messageLeft:0,exiting:false});rory.ballContacts.clear()}
function roryMessage(message,seconds){rory.message=message;rory.messageLeft=seconds}
function chooseRoryTarget(){rory.targetX=rnd(65,W-65);rory.targetY=rnd(220,H-85);rory.targetChangeTimer=rnd(2,3)}
function enterRory(){
 if(rory.isActive||rory.hasEntered)return false;
 const direction=Math.random()<.5?1:-1;
 Object.assign(rory,{isActive:true,hasEntered:true,x:direction===1?-60:W+60,y:rnd(225,H-100),direction,timer:0,duration:rnd(10,12),exiting:false,announced:false,inside:false});
 chooseRoryTarget();rory.ballContacts.clear();
 roryMessage('🎾 MAMMA RORY È ARRIVATA!',3);return true;
}
function exitRory(){rory.isActive=false;rory.ballContacts.clear();for(const p of G.dogs){p.target=target();p.expression='normal';p.isChasingRory=false;p.turnIn=rnd(.6,1.4)}roryMessage('Rory se ne va... i cuccioli sono esausti',2)}
function updateRory(dt){
 rory.messageLeft=Math.max(0,rory.messageLeft-dt);
 if(!rory.hasEntered&&G.time>=rory.spawnAt)enterRory();
 if(!rory.isActive)return;
 // La permanenza di 10–12 s viene misurata da quando l'adulta è nella stanza.
 if(!rory.inside&&rory.x>=55&&rory.x<=W-55)rory.inside=true;
 if(rory.inside)rory.timer+=dt;
 if(rory.timer>=3&&!rory.announced){rory.announced=true;roryMessage('I cuccioli impazziscono!',2)}
 if(rory.timer>=rory.duration&&!rory.exiting){rory.exiting=true;rory.targetX=rory.x<W/2?-90:W+90;rory.targetY=rory.y}
 if(!rory.exiting){rory.targetChangeTimer-=dt;if(rory.targetChangeTimer<=0||Math.hypot(rory.targetX-rory.x,rory.targetY-rory.y)<8)chooseRoryTarget()}
 const dx=rory.targetX-rory.x,dy=rory.targetY-rory.y,d=Math.hypot(dx,dy),step=Math.min(d,120*dt);
 if(d>0){rory.x+=dx/d*step;rory.y+=dy/d*step;if(Math.abs(dx)>1)rory.direction=dx>0?1:-1}
 if(rory.exiting&&(rory.x < -75||rory.x>W+75)){exitRory();return}
 rory.ballX=rory.x+rory.direction*30;rory.ballY=rory.y+Math.sin(G.time*Math.PI*6)*8;
 const contacts=new Set();for(const m of G.messes){if(Math.hypot(m.x-rory.ballX,m.y-rory.ballY)>=25)continue;contacts.add(m);if(!rory.ballContacts.has(m)){const a=rnd(0,Math.PI*2),n=rnd(20,30);m.x=clamp(m.x+Math.cos(a)*n,25,W-25);m.y=clamp(m.y+Math.sin(a)*n,135,H-35)}}rory.ballContacts=contacts;
}
// Audio sintetico: nessun campione o risorsa di rete.
let audio=null,noise=null;
function unlock(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();noise=audio.createBuffer(1,Math.floor(audio.sampleRate*.2),audio.sampleRate);const a=noise.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){audio=null}}
function tone(f,end,dur,vol,type='sine',delay=0){if(!audio||muted||audio.state!=='running')return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+dur);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.015)}
function sfx(kind){if(!audio||muted)return;if(kind==='perfect'){[523.25,659.25,783.99].forEach((f,i)=>tone(f,f,.20,.09,'triangle',i*.075))}if(kind==='pop'){tone(420+G.combo*35,1100,.085,.11);tone(140,55,.1,.12)}if(kind==='scratch'||kind==='scratch_light')tone(kind==='scratch'?360:650,100,.10,.07,'sawtooth');if(kind==='squeak')tone(1100,2100,.13,.055,'triangle');if(kind==='splat'){tone(160,38,.18,.13,'triangle');const s=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter(),t=audio.currentTime;s.buffer=noise;f.type='lowpass';f.frequency.value=550;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);s.connect(f);f.connect(g);g.connect(audio.destination);s.start();s.stop(t+.17)}if(kind==='panic'){tone(480,950,.24,.08,'sawtooth');tone(950,480,.24,.06,'sawtooth',.25)}}
// play() e resume() vengono invocati immediatamente dal gesto utente, senza await.
const bgMusic=$('bgMusic');bgMusic.volume=.35;
let audioStarted=false;
function audioFallback(){const b=$('audioFallback');b.hidden=muted||G.state!=='play';b.textContent=bgMusic.error?'🔊 Musica assente · riprova':'🔊 Attiva audio';b.title=bgMusic.error?'Metti sottofondo.mp3 nella stessa cartella di index.html':'Tocca per attivare la musica'}
function startAudioOnUserGesture(restart=false){
 unlock();if(muted)return;
 if(restart){try{bgMusic.currentTime=0}catch(e){}}
 try{const promise=bgMusic.play();if(promise)promise.then(()=>{audioStarted=true;$('audioFallback').hidden=true;if(G.state!=='play'||paused)bgMusic.pause()}).catch(audioFallback)}catch(e){audioFallback()}
}
bgMusic.addEventListener('error',audioFallback);
$('audioFallback').onclick=()=>{if(bgMusic.error)bgMusic.load();startAudioOnUserGesture()};
$('audio').onclick=()=>{muted=!muted;$('audio').textContent=muted?'♫̸':'♫';$('audio').setAttribute('aria-label',muted?'Attiva audio':'Disattiva audio');bgMusic.muted=muted;if(muted){bgMusic.pause();$('audioFallback').hidden=true}else if(G.state==='play')startAudioOnUserGesture()};
function start(){unlock();Object.assign(G,{state:'play',time:0,score:0,clean:100,dogs:[],messes:[],particles:[],popups:[],flights:[],combo:0,lastClean:-9,panic:false,panicLeft:10,shake:0,spawn:15,beat:0,flash:0,trail:[],result:null,smearCount:0,smearsCreated:0,smearsCleaned:0,poopCollected:0,maxCombo:0,stepPenalty:0,tutorialIndex:0,colorFlash:null});resetRory();paused=false;pointer=null;$('cover').style.display='none';$('panic').style.display='none';$('sharePreview').hidden=true;$('resume').style.display='none';for(let i=0;i<STARTING_PUPPIES;i++)addDog(true);
// Nessuna macchia iniziale: cinque secondi per osservare i gesti.
updateHud()}
function onPlayButtonClicked(){start();startAudioOnUserGesture(true)}
$('play').onclick=onPlayButtonClicked;$('again').onclick=onPlayButtonClicked;
function addMess(x,y,kind,owner=null){
 if(G.messes.length>=230)return;
 G.messes.push({x:clamp(x,25,W-25),y:clamp(y,135,H-35),kind,owner,age:0,seed:rnd(0,6)});
 // Danno applicato una sola volta alla creazione, non a ogni frame.
 restoreClean(-(kind.startsWith('paw')?PAWPRINT_PENALTY:kind==='poop'?2.8:2));
}
function cleanliness(){G.clean=clamp(G.clean,0,100)}
function popup(x,y,text,color='#fff',size=23){if(G.popups.length>36)G.popups.shift();G.popups.push({x,y,text,color,size,life:1,max:1})}
function burst(x,y,dirty=false,kind='pee'){const n=reduceMotion?4:dirty?10:15;for(let i=0;i<n;i++){if(G.particles.length>=50)G.particles.shift();const a=rnd(0,Math.PI*2),v=rnd(45,180);G.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-45,life:rnd(.35,.7),max:.7,r:rnd(2,6),star:!dirty&&i%3===0,color:dirty?(kind==='poop'?'#9a542e':'#ffd52d'):colors[i%colors.length]})}}
// Un gesto viene risolto al rilascio: nessuna pulizia anticipata al pointerdown.
function feedback(message,color='#65f2c5'){popup(W/2,H*.39,message,color,Math.min(22,(W-24)/message.length*1.7))}
function clean(m){
 const i=G.messes.indexOf(m);if(i<0)return;G.messes.splice(i,1);
 G.combo=G.time-G.lastClean<.5?G.combo+1:1;G.lastClean=G.time;G.maxCombo=Math.max(G.maxCombo,G.combo);
 const base=m.kind==='poop'?15:m.kind==='smear'?8:10,points=base+5*(G.combo-1);G.score+=points;restoreClean(m.kind==='poop'?CLEAN_RESTORE.poop_tap:m.kind==='smear'?CLEAN_RESTORE.smear_tap:CLEAN_RESTORE.swipe_single);
 burst(m.x,m.y);if(m.kind==='poop'){G.poopCollected++;G.flights.push({x:m.x,y:m.y,t:0});for(const p of G.particles.slice(-15))p.color='#FFDF59';feedback('CACCA RACCOLTA! +'+points)}
 else if(m.kind==='smear'){G.smearsCleaned++;feedback('STRISCIA PULITA! +'+points)}else feedback('PULITO! +'+points);
 popup(m.x,m.y-20,'+'+points,'#fff',23);sfx(m.kind==='smear'?'scratch':'pop');try{if(navigator.vibrate)navigator.vibrate(9)}catch(e){}cleanliness();updateHud();
}
function createSmear(m){
 const i=G.messes.indexOf(m);if(i<0)return;G.messes.splice(i,1);const n=Math.floor(rnd(3,6));
 for(let j=0;j<n;j++)G.messes.push({kind:'smear',x:clamp(m.x+rnd(-50,50),25,W-25),y:clamp(m.y+rnd(-20,20),135,H-35),tapsRemaining:2,age:0,rotation:rnd(0,Math.PI*2)});
 restoreClean(CLEAN_RESTORE.smear_penalty);G.smearCount++;G.smearsCreated+=n;const penalty=G.smearCount*5;G.score=Math.max(0,G.score-penalty);
 G.shake=reduceMotion?0:10;burst(m.x,m.y,true,'poop');sfx('splat');feedback('OH NO! HAI SPALMATO! -'+penalty,'#FF4444');cleanliness();updateHud();
}
function segmentDistance(m,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=l?clamp(((m.x-a.x)*dx+(m.y-a.y)*dy)/l,0,1):0;return Math.hypot(m.x-a.x-t*dx,m.y-a.y-t*dy)}
function handleTap(pos){
 // Sceglie la macchia più vicina: le strisce sovrapposte restano selezionabili.
 const m=G.messes.filter(m=>Math.hypot(pos.x-m.x,pos.y-m.y)<HITBOX_TAP).sort((a,b)=>Math.hypot(pos.x-a.x,pos.y-a.y)-Math.hypot(pos.x-b.x,pos.y-b.y))[0];if(!m)return;
 if(m.kind==='pee')return;
 if(m.kind==='smear'){m.tapsRemaining--;if(m.tapsRemaining>0){restoreClean(CLEAN_RESTORE.smear_tap);updateHud();sfx('scratch_light');feedback('ANCORA 1 TAP!','#FFA500');return}}
 clean(m);
}
function distanceToPath(m,path){let best=Infinity;for(let i=1;i<path.length;i++)best=Math.min(best,segmentDistance(m,path[i-1],path[i]));return best}
function handleSwipe(path){
 let cleaned=0;
 // Snapshot: le strisce appena create non vengono colpite dallo stesso gesto.
 for(const m of [...G.messes]){
  if(distanceToPath(m,path)>=HITBOX_SWIPE)continue;
  if(m.kind==='poop')createSmear(m);
  else if(m.kind==='pee'||m.kind.startsWith('paw')){clean(m);cleaned++}
 }
 if(cleaned>=3){
  const bonus=25*(cleaned-2);G.score+=bonus;restoreClean(CLEAN_RESTORE.swipe_perfect);
  feedback('✨ SWIPE PERFETTO! x'+cleaned+' +'+bonus,'#FFD700');
  sfx('perfect');flashScreen('#FFD700',.25);G.shake=reduceMotion?0:6;
  const center=path[Math.floor(path.length/2)];burst(center.x,center.y);
  for(const particle of G.particles.slice(-15))particle.color='#FFD700';
  try{if(navigator.vibrate)navigator.vibrate([30,20,50])}catch(e){}
 }
 updateHud();
}

 ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(const p of path)ctx.lineTo(p.x,p.y);ctx.stroke();

 for(const m of G.messes){if((m.kind==='pee'||m.kind.startsWith('paw'))&&distanceToPath(m,path)<HITBOX_SWIPE){ctx.strokeStyle='rgba(90,140,200,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(m.x,m.y,22*pulse,0,Math.PI*2);ctx.stroke()}}
 ctx.restore();
}
let pointer=null;
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
canvas.addEventListener('pointerdown',e=>{if(G.state!=='play'||paused||pointer)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,start:performance.now(),path:[point(e)],distance:0}});
function appendPoint(e){const p=point(e),prev=pointer.path[pointer.path.length-1];pointer.distance+=Math.hypot(p.x-prev.x,p.y-prev.y);pointer.path.push(p);G.trail.push({...p,life:.18});if(G.trail.length>30)G.trail.shift()}
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||paused)return;e.preventDefault();appendPoint(e)});

}
for(const p of G.dogs)p.expression=rory.isActive?'excited':G.panic?'panicked':p.next<.42?'warning':p.dirty||p.moodLeft>0?'guilty':'normal';
cleanliness();if(!G.panic&&G.clean<25){G.panic=true;G.panicLeft=10;G.shake=reduceMotion?0:18;G.flash=.4;sfx('panic')}else if(G.panic&&G.clean>=25){G.panic=false;G.panicLeft=10;G.score+=50;popup(W/2,H*.35,'STANZA SALVATA! +50','#65f2c5',27)}
if(G.panic){G.panicLeft-=dt;if(G.panicLeft<=0){finish(false);return}}if(G.clean<=0){finish(false);return}if(G.time>=60){finish(true);return}
bgMusic.volume=G.panic?.5:.35;bgMusic.playbackRate=G.panic?1.1:1;G.beat-=dt;if(G.beat<=0){G.beat=G.panic?.20:.40;const n=Math.floor(G.time/(G.panic?.20:.40))%4;if(G.panic)tone(550+(10-G.panicLeft)*45,900,.12,.025,'square')}
if(G.colorFlash)G.colorFlash.left=Math.max(0,G.colorFlash.left-dt);G.shake=Math.max(0,G.shake-dt*35);G.flash=Math.max(0,G.flash-dt);G.binPop=Math.max(0,G.binPop-dt*3);
for(const p of G.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt}G.particles=G.particles.filter(p=>p.life>0);for(const p of G.popups){p.life-=dt;p.y-=40*dt}G.popups=G.popups.filter(p=>p.life>0);for(const f of G.flights){f.t+=dt*2.6;if(f.t>=1)G.binPop=1}G.flights=G.flights.filter(f=>f.t<1);for(const t of G.trail)t.life-=dt;G.trail=G.trail.filter(t=>t.life>0);updateHud()}

// Primitive condivise: tutta la grafica viene generata in Canvas 2D.
function ellipse(c,x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
function poly(c,pts,color){c.fillStyle=color;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
function round(c,x,y,w,h,r,color){r=Math.min(r,w/2,h/2);c.fillStyle=color;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill()}
function text(c,s,x,y,size,color='#211544',align='center'){c.font=`900 ${size}px system-ui, sans-serif`;c.fillStyle=color;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y)}

function drawPuppy(c,p,t=0,size=1){
 const {name='Jess',colors:colorScheme=PUPPY_PROFILES[1].colors,personality='classic',expression='normal'}=p;
 const k=colorScheme,coat=k.patches[0],tan=k.patches[1]||coat,phase=(p.phase||0)+t;
 const motion=TEMPERAMENTS[personality],bounce=reduceMotion?0:Math.sin(phase)*motion.bounce;
 c.save();c.translate(p.x,p.y);c.scale((p.facing||1)*size,size);
 ellipse(c,0,23,35,8,'#48315b25');c.translate(0,bounce);
 if(!reduceMotion)c.rotate(Math.sin(phase*.5)*(personality==='playful'?.055:personality==='shy'?.012:.025));
 // Coda folta con punta bianca e oscillazione propria del carattere.
 c.save();c.translate(-25,-5);c.rotate(Math.sin(phase*.7)*(personality==='playful'?.48:.22));
 poly(c,[[-2,7],[-24,0],[-32,-18],[-19,-12],[-15,-21],[-8,-8],[5,-2]],coat);
 poly(c,[[-24,0],[-32,-18],[-19,-12],[-21,-4]],k.body);c.restore();
 for(const x of [-18,15]){const dy=reduceMotion?0:Math.sin(phase+x)*motion.stride;
 round(c,x-5,5+dy,11,18,5,['playful','mischievous'].includes(personality)?tan:coat);
 round(c,x-5,18+dy,12,7,3,personality==='mischievous'?tan:k.body)}
 // Base bianca; i pattern sono distinti anche senza collare e nome.
 ellipse(c,-2,-1,28,18,k.body);
 if(personality==='shy'){
  ellipse(c,-16,-7,10,8,coat);ellipse(c,3,5,9,6,tan);ellipse(c,13,-11,6,5,coat);
 }else{ellipse(c,-9,-6,21,12,coat);if(personality==='playful')ellipse(c,-20,5,7,6,tan)}
 ellipse(c,13,1,10,15,k.body);ellipse(c,22,-15,19,20,k.body);
 if(personality==='mischievous'){
  c.save();c.beginPath();c.ellipse(22,-15,19,20,0,0,Math.PI*2);c.clip();
  c.fillStyle=coat;c.fillRect(2,-38,20,46);c.fillStyle=tan;c.fillRect(22,-38,22,46);c.restore();
 }else if(personality==='shy'){
  ellipse(c,11,-21,9,11,coat);ellipse(c,31,-16,8,7,tan);
 }else{ellipse(c,22,-15,19,20,coat)}
 const droop=personality==='shy'?6:0;
 poly(c,[[7,-27],[9,-48+droop],[20,-38],[19,-28]],k.ears);
 poly(c,[[25,-29],[38,-43+droop],[40,-27],[34,-22]],personality==='mischievous'?tan:k.ears);
 poly(c,[[9,-43+droop],[14,-34],[11,-32]],'#e69caf');
 poly(c,[[34,-37+droop],[37,-29],[32,-30]],'#e69caf');
 poly(c,[[19,-34],[25,-33],[25,-18],[32,-7],[16,-5],[16,-18]],k.body);
 ellipse(c,30,-9,14,10,k.body);
 if(personality==='playful'){ellipse(c,13,-25,5,2.5,tan);ellipse(c,30,-27,4,2,tan);ellipse(c,34,-6,6,3,tan)}
 ellipse(c,39,-12,5,4,'#171625');
 // Espressioni guidate dalla simulazione: allerta, colpa e panico.
 const excited=expression==='excited',worried=excited||expression==='warning'||expression==='panicked',guilty=expression==='guilty';
 for(const [x,y]of [[15,-20],[30,-22]]){
  ellipse(c,x,y,worried?4.6:3.8,worried?5.7:personality==='elegant'?3.5:4.8,'#fff');
  ellipse(c,x+(guilty?-1:personality==='mischievous'?1:0),y+(guilty?1:0),2.4,worried?3.5:3.1,'#171625');
  ellipse(c,x+.7,y-1, .8,1,'#fff');
 }
 c.strokeStyle='#211544';c.lineWidth=1.8;c.lineCap='round';c.beginPath();
 if(worried||guilty||personality==='shy'){c.moveTo(11,-28);c.lineTo(18,-30);c.moveTo(27,-31);c.lineTo(33,-28)}
 else if(personality==='mischievous'){c.moveTo(11,-28);c.lineTo(18,-25);c.moveTo(27,-28);c.lineTo(34,-30)}
 else if(personality==='elegant'){c.moveTo(12,-24);c.lineTo(10,-26);c.moveTo(29,-26);c.lineTo(28,-28)}c.stroke();
 if(excited){ellipse(c,29,0,6,6,'#211544');round(c,28,0,6,10,3,'#ff7799')}
 else if(expression==='panicked')ellipse(c,29,0,4,5,'#211544');

 else ellipse(c,29,0,personality==='shy'?2.5:4,personality==='playful'?7:4,'#ff7799');
 round(c,8,2,23,5,2,k.collar);ellipse(c,24,10,3,4,'#ffdf59');
 if(p.dirty){ellipse(c,-17,23,6,3,p.dirty==='poop'?'#9a542e':'#e8bb24');ellipse(c,17,23,6,3,p.dirty==='poop'?'#9a542e':'#e8bb24')}
 c.restore();
 // Etichette con bordo ad alto contrasto; posizione limitata ai bordi del canvas.

function mess(c,m){const{x,y,kind}=m;if(kind==='smear'){c.save();c.translate(x,y);c.rotate(m.rotation||0);ellipse(c,0,0,12.5,5,m.tapsRemaining===1?'#B89968':'#8B6F47');c.restore();text(c,String(m.tapsRemaining),x,y-14,13,'#211544')}else if(kind==='poop'){ellipse(c,x,y+3,21,7,'#48315b25');ellipse(c,x,y-2,17,10,'#784027');ellipse(c,x+1,y-12,12,8,'#995633');ellipse(c,x+2,y-21,6,6,'#bd7641');ellipse(c,x-6,y-13,3,2,'#df9b58');ellipse(c,x-5,y-4,2,2,'#291d2c');ellipse(c,x+5,y-4,2,2,'#291d2c')}else if(kind==='pee'){ellipse(c,x,y,29,14,'#d9a91d');ellipse(c,x,y-2,27,13,'#ffdb37');ellipse(c,x-9,y-6,9,3,'#fff3a4');ellipse(c,x+15,y+2,4,2,'#fff3a4')}else{c.save();c.translate(x,y);c.rotate(Math.sin(m.seed||0)*.5);const col=kind==='paw_poop'?'#9b5e3a':'#dcae20';ellipse(c,0,3,8,6,col);for(const [x,y]of[[-9,-4],[-4,-9],[4,-9],[9,-4]])ellipse(c,x,y,3.4,4,col);c.restore()}}
function bin(c){const x=W-48,y=H-55;c.save();c.translate(x,y);c.scale(1+G.binPop*.12,1+G.binPop*.12);ellipse(c,0,27,30,8,'#48315b30');round(c,-23,-15,46,44,7,'#211544');round(c,-19,-12,38,36,5,'#58dbb3');for(const dx of[-10,0,10])round(c,dx-2,-6,4,22,2,'#278b83');round(c,-27,-22,54,9,4,'#211544');round(c,-11,-28,22,6,3,'#211544');text(c,'↙',0,3,23,'#211544');c.restore()}
function star(c,x,y,r,color){const pts=[];for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,k=i%2?.42:1;pts.push([x+Math.cos(a)*r*k,y+Math.sin(a)*r*k])}poly(c,pts,color)}
function draw(){ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(G.shake&&!reduceMotion&&G.state==='play'&&!paused)ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));ctx.fillStyle='#f7dfb8';ctx.fillRect(-25,-25,W+50,H+50);const tile=56;for(let y=105;y<H+tile;y+=tile)for(let x=-tile;x<W+tile;x+=tile)if((Math.floor(x/tile)+Math.floor((y-105)/tile))%2===0){ctx.fillStyle='#edcda0';ctx.fillRect(x,y,tile,tile)}ctx.fillStyle='#cda67e';ctx.fillRect(0,100,W,7);ctx.fillStyle='#fff0d4';ctx.fillRect(0,92,W,8);
for(const m of G.messes)mess(ctx,m);bin(ctx);for(const actor of [...G.dogs,...(rory.isActive?[rory]:[])].sort((a,b)=>a.y-b.y)){if(actor===rory)drawRory(rory.x,rory.y,rory.direction===1,rory.timer*10);else drawPuppy(ctx,actor)}if(rory.isActive)drawRoryBall();
for(const f of G.flights){const t=f.t,e=1-(1-t)*(1-t);ctx.save();ctx.translate(f.x+(W-48-f.x)*e,f.y+(H-65-f.y)*e-Math.sin(t*Math.PI)*100);ctx.scale(1-t*.65,1-t*.65);ctx.rotate(t*8);mess(ctx,{x:0,y:0,kind:'poop'});ctx.restore()}
for(const p of G.particles){ctx.globalAlpha=clamp(p.life/.3,0,1);if(p.star)star(ctx,p.x,p.y,p.r*1.8,p.color);else ellipse(ctx,p.x,p.y,p.r,p.r,p.color)}ctx.globalAlpha=1;
if(G.trail.length>1){ctx.lineCap='round';ctx.lineJoin='round';for(let i=1;i<G.trail.length;i++){const a=G.trail[i-1],b=G.trail[i];ctx.strokeStyle=`rgba(255,255,255,${b.life/.18*.8})`;ctx.lineWidth=9*b.life/.18;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
drawSwipePreview();
for(const p of G.popups){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.font=`900 ${p.size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='#211544';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y)}ctx.globalAlpha=1;ctx.restore();
if(G.panic&&G.state==='play'){ctx.save();const grad=ctx.createRadialGradient(W/2,H/2,W*.15,W/2,H/2,Math.max(W,H)*.65);grad.addColorStop(0,'#ff174400');grad.addColorStop(1,`rgba(255,20,60,${.40+Math.sin(G.time*10)*.14})`);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.restore()}
if(G.combo>1&&G.time-G.lastClean<.65&&G.state==='play'){const t=G.time-G.lastClean;ctx.save();ctx.translate(W/2,H*.29);const s=1+Math.max(0,.16-t)*1.7;ctx.scale(s,s);ctx.font='950 52px system-ui';ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#211544';ctx.strokeText('×'+G.combo,0,0);ctx.fillStyle='#ffdf59';ctx.fillText('×'+G.combo,0,0);text(ctx,'COMBO!',0,24,13,'#211544');ctx.restore()}
if(G.colorFlash&&G.colorFlash.left>0&&G.state==='play'){ctx.save();ctx.globalAlpha=(reduceMotion?.08:.28)*G.colorFlash.left/G.colorFlash.duration;ctx.fillStyle=G.colorFlash.color;ctx.fillRect(0,0,W,H);ctx.restore()}
drawRoryMessage();
// Gesto dimostrativo solo nei primi tre secondi, senza parole.
if(false){const t=(G.time%1.5)/1.5,x=W*.25+t*W*.45,y=H*.49+t*H*.09;ctx.save();ctx.globalAlpha=Math.sin(t*Math.PI)*.85;ellipse(ctx,x,y,20,20,'#ffffff99');text(ctx,'☝',x,y,43,'#fff');ctx.restore()}}
function loop(now){const dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}
for(let i=0;i<STARTING_PUPPIES;i++)addDog(true);addMess(W*.34,H*.48,'poop');addMess(W*.62,H*.67,'pee');requestAnimationFrame(loop);
// Sospensione esplicita: non si perde una partita cambiando scheda o applicazione.
document.addEventListener('visibilitychange',()=>{if(document.hidden){pointer=null;if(G.state==='play'){paused=true;$('resume').style.display='grid'}bgMusic.pause();if(audio)audio.suspend().catch(()=>{})}});$('resumeButton').onclick=()=>{startAudioOnUserGesture();paused=false;last=performance.now();$('resume').style.display='none'};
// Cartolina originale 1080×1350: esportazione Canvas, nessuna libreria esterna.
let shareBlob=null;
function shareCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const q=c.getContext('2d'),r=G.result;q.fillStyle='#211544';q.fillRect(0,0,1080,1350);for(let y=830;y<1350;y+=90)for(let x=0;x<1080;x+=90){q.fillStyle=(x/90+y/90|0)%2?'#f4d8ab':'#eac494';q.fillRect(x,y,90,90)}text(q,'EXTREME MODE',540,100,29,'#65f2c5');text(q,'CUCCIOLI',540,200,98,'#fff');text(q,'CHAOS',540,298,122,'#ffdf59');round(q,80,365,920,400,46,'#342350');text(q,r.score.toLocaleString('it-IT'),540,475,136,'#ffdf59');text(q,'PUNTI DI PURO CAOS',540,570,25,'#fff');text(q,`${r.seconds}s · ${r.dogs} CUCCIOLI · ${r.clean}% PULIZIA`,540,646,31,'#65f2c5');text(q,r.verdict,540,706,30,'#fff');text(q,`CACCHE ${r.poopCollected} · STRISCE CREATE ${r.smearsCreated} · PULITE ${r.smearsCleaned}`,540,785,25,'#fff');text(q,`SPALMATURE ${r.smearCount} · COMBO MASSIMA ×${r.maxCombo}`,540,829,26,'#65f2c5');drawPuppy(q,{...PUPPY_PROFILES[0],x:285,y:1020,facing:1,phase:1,expression:'normal'},0,3);drawPuppy(q,{...PUPPY_PROFILES[4],x:795,y:1020,facing:-1,phase:3,expression:'guilty'},0,3);mess(q,{x:540,y:1005,kind:'poop'});round(q,90,1130,900,145,28,'#211544');text(q,'RIESCI A BATTERMI?',540,1180,46,'#fff');text(q,'#CuccioliChaos',540,1237,31,'#ffdf59');return c}
$('share').onclick=async()=>{if(!G.result)return;const btn=$('share');btn.disabled=true;const r=G.result,phrase=`Ho sopravvissuto ${r.seconds}s a ${r.dogs} cuccioli caotici! Riesci a battermi? 🐶💩 #CuccioliChaos`;try{const c=shareCard(),url=c.toDataURL('image/png');$('shareImage').src=url;$('download').href=url;$('sharePreview').hidden=false;$('shareStatus').textContent=phrase;shareBlob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));const file=shareBlob&&typeof File!=='undefined'?new File([shareBlob],'cuccioli-chaos.png',{type:'image/png'}):null;if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Cuccioli Chaos',text:phrase})}else if(navigator.share){await navigator.share({title:'Cuccioli Chaos',text:phrase})}else{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(phrase);$('shareStatus').textContent='Testo copiato! '+phrase}}catch(e){}}}catch(e){if(e.name!=='AbortError')$('shareStatus').textContent=phrase+' Salva l’immagine qui sotto per condividerla.'}finally{btn.disabled=false}};
</script>
